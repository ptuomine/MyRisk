<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyRisk</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="gamepanel">
        <div class="setup">
            <button id="newgame" onClick="resetGameBoard()">New Game</button>
            <div id="aiplayerselection">
                <label><input type="checkbox" id="aiPlayer1"> AI Player 1</label>
                <label><input type="checkbox" id="aiPlayer2" checked> AI Player 2</label>
                <label><input type="checkbox" id="aiPlayer3" checked> AI Player 3</label>
            </div>
        </div>

        <section id="turnpanel" aria-live="polite">
            <div id="turnbanner">
                <span class="turn-swatch" aria-hidden="true"></span>
                <span class="turn-text">
                    <strong id="turnplayer"></strong>
                    <span id="turnrole"></span>
                </span>
            </div>
            <ol id="phases" aria-label="Turn phases">
                <li><span id="phase-draft" class="phase">Draft</span></li>
                <li><button id="startwar" class="phase" onClick="startWar()">Attack</button></li>
                <li><button id="fortify" class="phase" onClick="moveTroops()">Move</button></li>
                <li><button id="endturn" class="phase" onClick="endTurn()">End turn</button></li>
            </ol>
            <p id="turnhint"></p>
            <div class="turn-actions">
                <button id="gobattle" class="primary" onClick="goBattle()" hidden>Attack!</button>
                <button id="sellcards" onClick="sellCards()" hidden>Trade cards</button>
            </div>
        </section>

        <div id="continentsArea"></div>

        <div id=playerstats>
            <table id="playertable" Border=1></table>
        </div>
        <div id="aiMoveSummary">
            <h3>Moves</h3>
            <ul id="aiMoveList"></ul>
        </div>
    </div>
    <script src="dist/bundle.js"></script>
</body>
</html>
